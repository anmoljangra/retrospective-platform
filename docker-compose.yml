services:
  db:
    image: postgres:16-alpine
    container_name: retrospace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retrospace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retrospace_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-retrospace}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: retrospace-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-retrospace}:${POSTGRES_PASSWORD:-retrospace_local_dev_password}@db:5432/${POSTGRES_DB:-retrospace}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-retrospace_dev_jwt_access_secret_32_characters_minimum}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-retrospace_dev_jwt_refresh_secret_32_characters_minimum}
      COOKIE_SECRET: ${COOKIE_SECRET:-retrospace_dev_cookie_secret_32_characters_minimum}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:4000}
    container_name: retrospace-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5173/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: retrospace_postgres_data
